<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students | Library Management System</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            <i class="fas fa-book-open"></i>
            Library Management System
        </div>

        <div class="nav-right">

            <button id="darkBtn">🌙</button>

            <div class="profile">
                <i class="fas fa-user-circle"></i>
                Admin
            </div>

        </div>

    </nav>

    <div class="container">

        <!-- Welcome -->

        <section class="welcome">

            <h2>👨‍🎓 Student Management</h2>

            <p>Manage students, departments and library members.</p>

        </section>

        <!-- Dashboard -->

        <section class="dashboard">

            <div class="card blue">
                <i class="fas fa-users"></i>
                <h2 id="totalStudents">0</h2>
                <p>Total Students</p>
            </div>

            <div class="card green">
                <i class="fas fa-user-check"></i>
                <h2 id="activeStudents">0</h2>
                <p>Active Students</p>
            </div>

            <div class="card orange">
                <i class="fas fa-building"></i>
                <h2 id="totalDepartments">0</h2>
                <p>Departments</p>
            </div>

            <div class="card purple">
                <i class="fas fa-graduation-cap"></i>
                <h2 id="finalYearStudents">0</h2>
                <p>Final Year</p>
            </div>

        </section>

        <!-- Add Student -->

        <section class="form-container">

            <h2>

                <i class="fas fa-user-plus"></i>

                Add Student

            </h2>

            <div class="form">

                <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name">

                <input
                    type="text"
                    id="studentRoll"
                    placeholder="Roll Number">

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Email">

                <input
                    type="text"
                    id="studentPhone"
                    placeholder="Phone Number">

                <input
                    type="text"
                    id="studentDept"
                    placeholder="Department">

                <select id="studentYear">

                    <option value="">Select Year</option>

                    <option>1st Year</option>

                    <option>2nd Year</option>

                    <option>3rd Year</option>

                    <option>4th Year</option>

                </select>

                <button onclick="addStudent()">

                    <i class="fas fa-plus"></i>

                    Add Student

                </button>

            </div>

        </section>

        <!-- Search -->

        <section class="searchBox">

            <i class="fas fa-search"></i>

            <input
                type="text"
                id="searchStudent"
                placeholder="Search Student..."
                onkeyup="searchStudent()">

        </section>

        <!-- Student Table -->

        <section class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Roll No</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Department</th>

                        <th>Year</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </section>

    </div>

    <footer>

        © 2026 Library Management System

    </footer>

    <script src="js/students.js"></script>

    <script src="js/darkmode.js"></script>
    <script src="js/sidebar.js"></script>

</body>

</html>
